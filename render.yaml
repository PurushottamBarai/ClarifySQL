services:
  # -------------------------------------------------------------
  # 1. ClarifySQL Backend (Node.js Express Web Service)
  # -------------------------------------------------------------
  - type: web
    name: clarifysql-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        fromStaticSite:
          name: clarifysql-client
          property: url
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false

  # -------------------------------------------------------------
  # 2. ClarifySQL Frontend (Vite React Static Site)
  # -------------------------------------------------------------
  - type: static
    name: clarifysql-client
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: clarifysql-api
          property: url

